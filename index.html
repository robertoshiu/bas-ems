<!doctype html>
<html lang="en">
<head>

<title>bas-ems · Fab Building Automation &amp; Energy Management</title>
<meta name="description" content="Static simulation of a semiconductor fab Building Automation System (BAS) and Energy Management System (EMS). Synthetic data, no backend." />

<script src="src/ui/ticker.js"></script>
<script src="src/ui/livefab.js"></script>
<script src="src/ui/timeline-data.js"></script>
<script src="src/ui/timeline.js"></script>

<!-- modules (registration order; nav groups by 'group') -->
<script src="src/modules/overview.js"></script>
<script src="src/modules/production.js"></script>
<script src="src/modules/trends.js"></script>
<script src="src/modules/cleanroom.js"></script>

<script src="src/app/clock-source.js"></script>
<script src="src/app/replay.js"></script>
